<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Platzhalter für ein Porträtfoto">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23407a"/>
      <stop offset="1" stop-color="#0f1b2d"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffc83d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffc83d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <rect width="400" height="500" fill="url(#grid)"/>
  <rect width="400" height="500" fill="url(#glow)"/>
  <!-- duotone bust outline -->
  <g fill="none" stroke="#ffc83d" stroke-opacity="0.28" stroke-width="1.5">
    <circle cx="200" cy="214" r="78"/>
    <path d="M60 500c0-92 62-156 140-156s140 64 140 156"/>
  </g>
  <!-- house mark -->
  <g transform="translate(340 34)" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.6" stroke-linejoin="round">
    <path d="M0 10 10 2l10 8v10H0z"/>
    <rect x="7" y="12" width="6" height="8" fill="#ffc83d" stroke="none"/>
  </g>
</svg>
